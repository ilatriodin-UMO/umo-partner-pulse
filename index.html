<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f8fb;color:#172033;font:14px Arial}.wrap{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:22px;box-shadow:0 8px 24px #10182812}input,select,button{height:46px;border:1px solid #d0d5dd;border-radius:11px;padding:0 13px;font:inherit;box-sizing:border-box}select,input{width:100%;margin-top:8px}button{background:#155eef;color:#fff;border:0;font-weight:700;cursor:pointer;padding:0 16px;margin-top:12px}.secondary{background:#eff4ff;color:#1849a9}.status{margin-top:14px;padding:12px;border-radius:9px;background:#f2f4f7;white-space:pre-wrap}.ok{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}.muted{color:#667085}</style></head><body><div class="wrap"><div class="card"><h1>UMO Partner Pulse</h1><p class="muted">Выбор пользователя</p><div id="status" class="status">Инициализация…</div><label>Пользователь</label><select id="employee"><option value="">Выберите пользователя</option></select><input id="newUser" placeholder="Или введите имя вручную"><button id="addUser" class="secondary">Добавить имя</button><button id="continue">Продолжить</button></div></div><script>
window.addEventListener('DOMContentLoaded',function(){
const URL='https://xufsoxmcsvxqujgijtqx.supabase.co';const KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';const LOCAL='umo_dashboard_users';const $=id=>document.getElementById(id);const setStatus=(text,kind='')=>{$('status').textContent=text;$('status').className='status '+kind};const esc=s=>String(s??'').replace(/[&<>"']/g,'');let local=[];try{local=JSON.parse(localStorage.getItem(LOCAL)||'[]')}catch(e){};function draw(a){local=[...new Set(a.map(x=>String(x).trim()).filter(Boolean))];localStorage.setItem(LOCAL,JSON.stringify(local));$('employee').innerHTML='<option value="">Выберите пользователя</option>'+local.map(x=>'<option>'+esc(x)+'</option>').join('')};function fallback(message){draw(local);setStatus(message+'\nМожно добавить имя вручную.','error')};async function start(){if(!window.supabase){fallback('SDK Supabase не загрузился.');return}try{setStatus('Подключение к Supabase…');const client=window.supabase.createClient(URL,KEY);const result=await client.from('employees').select('full_name').eq('active',true).order('sort_order');if(result.error)throw result.error;const names=(result.data||[]).map(x=>x.full_name);draw(names);setStatus('Список загружен. Сотрудников: '+names.length,'ok')}catch(e){fallback('Ошибка загрузки списка сотрудников: '+e.message)}}$('addUser').onclick=function(){const n=$('newUser').value.trim();if(!n)return;draw([...local,n]);$('employee').value=n;$('newUser').value='';setStatus('Имя добавлено. Нажмите «Продолжить».','ok')};$('continue').onclick=function(){const n=$('employee').value;if(!n){setStatus('Выберите пользователя или добавьте имя вручную.','error');return}localStorage.setItem('umo_employee',n);setStatus('Выбран пользователь: '+n,'ok')};draw(local);start();
});
</script></body></html>
