<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f8fb;color:#172033;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 8px 24px #10182812}input,select,button{height:46px;border:1px solid #d0d5dd;border-radius:11px;padding:0 13px;font:inherit;box-sizing:border-box}select,input{width:100%;margin-top:8px}button{background:#155eef;color:#fff;border:0;font-weight:700;cursor:pointer;padding:0 16px;margin-top:12px}.secondary{background:#eff4ff;color:#1849a9}.muted{color:#667085}.status{margin-top:14px;padding:12px;border-radius:9px;background:#f2f4f7;white-space:pre-wrap}.ok{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}.hidden{display:none}.dashboard{margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid #e4e7ec;border-radius:12px;padding:16px}.value{font-size:26px;font-weight:800;margin-top:6px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px 8px;border-bottom:1px solid #e4e7ec;text-align:left}th{background:#f8fafc}@media(max-width:650px){.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card" id="chooser"><h1>UMO Partner Pulse</h1><p class="muted">Выберите сотрудника для входа</p><div id="status" class="status">Инициализация…</div><select id="employee"><option value="">Выберите пользователя</option></select><input id="newUser" placeholder="Или введите имя вручную"><button id="addUser" class="secondary">Добавить имя</button><button id="continue">Продолжить</button></div><div class="card dashboard hidden" id="app"><h1>UMO Partner Pulse</h1><p id="who" class="muted"></p><button id="reload">Загрузить данные</button><div class="stats"><div class="stat">Всего заявок<div class="value" id="count">0</div></div><div class="stat">Заявок за месяц<div class="value" id="monthCount">0</div></div><div class="stat">Статус подключения<div class="value" id="dbStatus">—</div></div></div><div id="data" class="status">Загрузка заявок…</div><table><thead><tr><th>Дата</th><th>Клиент</th><th>ИНН</th><th>Статус</th><th>Автор</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>window.addEventListener('DOMContentLoaded',function(){const URL='https://xufsoxmcsvxqujgijtqx.supabase.co',KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S',LOCAL='umo_dashboard_users',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),setStatus=(t,k='')=>{$('status').textContent=t;$('status').className='status '+k},esc=s=>String(s??'').replace(/[&<>"']/g,'');let users=[];try{users=JSON.parse(localStorage.getItem(LOCAL)||'[]')}catch(e){};function draw(){users=[...new Set(users.map(x=>String(x).trim()).filter(Boolean))];localStorage.setItem(LOCAL,JSON.stringify(users));$('employee').innerHTML='<option value="">Выберите пользователя</option>'+users.map(x=>'<option>'+esc(x)+'</option>').join('')}async function loadUsers(){try{const r=await db.from('employees').select('full_name').eq('active',true).order('sort_order');if(r.error)throw r.error;users=(r.data||[]).map(x=>x.full_name);draw();setStatus('Список загружен. Сотрудников: '+users.length,'ok')}catch(e){draw();setStatus('Список из Supabase не загружен: '+e.message+'\nМожно использовать локальный список.','error')}}async function open(){const name=$('employee').value;if(!name){setStatus('Выберите сотрудника.','error');return}localStorage.setItem('umo_employee',name);$('chooser').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Пользователь: '+name;await loadData()}async function loadData(){const r=await db.from('partner_requests').select('*').order('request_date',{ascending:false});if(r.error){$('dbStatus').textContent='Ошибка';$('data').textContent='Ошибка загрузки заявок: '+r.error.message;return}const rows=r.data||[];$('dbStatus').textContent='OK';$('count').textContent=rows.length;const m=new Date().toISOString().slice(0,7);$('monthCount').textContent=rows.filter(x=>String(x.request_date||'').slice(0,7)===m).length;$('data').textContent='Заявки загружены';$('rows').innerHTML=rows.map(x=>'<tr><td>'+esc(x.request_date)+'</td><td>'+esc(x.client||x.partner)+'</td><td>'+esc(x.inn)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.created_by_name)+'</td></tr>').join('')}$('addUser').onclick=function(){const n=$('newUser').value.trim();if(!n)return;users.push(n);draw();$('employee').value=n;$('newUser').value='';setStatus('Пользователь добавлен. Нажмите «Продолжить».','ok')};$('continue').onclick=open;$('reload').onclick=loadData;draw();loadUsers();const saved=localStorage.getItem('umo_employee');if(saved){setTimeout(()=>{if(users.includes(saved)){$('employee').value=saved}},500)}})</script></body></html>
