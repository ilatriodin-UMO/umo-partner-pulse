<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#0d0f0e;color:#f1f3ef;font:15px Arial;padding:24px}.box{max-width:1160px;margin:auto;background:#171a18;border:1px solid #303632;border-radius:14px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303632;padding-bottom:16px}.logo{display:inline-grid;place-items:center;width:30px;height:30px;background:#ff715f;border-radius:8px;color:#111;font-weight:bold;margin-right:8px}.muted{color:#9ba39d}.status{margin:20px 0;padding:14px;border-radius:8px;background:#202521;white-space:pre-wrap;line-height:1.5}.ok{border-left:4px solid #4ac7a2}.err{border-left:4px solid #ff715f;background:#38201d}.actions{display:flex;gap:10px;flex-wrap:wrap}button,select,input{padding:10px 14px;border-radius:8px;border:1px solid #424a45;background:#0d0f0e;color:#fff;font-size:14px;cursor:pointer}.primary{background:#ff715f;color:#111;border:0;font-weight:bold}.secondary{background:#24302a}.danger{background:#3a211f;color:#ffb4aa}.hidden{display:none}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.form input{min-width:0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:10px;border-bottom:1px solid #303632}.num{text-align:right}.tag{display:inline-block;background:#28322d;color:#b9f2d8;border-radius:999px;padding:4px 9px;font-size:12px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.chart{background:#111412;border:1px solid #303632;border-radius:12px;padding:14px;height:310px}.chart h3{margin:0 0 12px;font-size:16px}.chart canvas{max-height:260px}.editbar{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.right{white-space:nowrap}@media(max-width:800px){.form,.charts{grid-template-columns:1fr}.box{padding:16px}table{font-size:12px}.chart{height:280px}}</style></head><body><main class="box"><div class="top"><div><span class="logo">U</span><b>PARTNER PULSE</b></div><div id="who" class="muted"></div></div><h1>Воронка партнёрских продаж</h1><p class="muted">Нажмите «Изменить» у отдельной заявки. Сводная таблица по ИНН обновится автоматически.</p><div id="status" class="status">Проверяем подключение…</div><section id="chooser" class="hidden"><h2>Выберите сотрудника</h2><select id="employee"></select><button class="primary" id="choose">Продолжить</button></section><section id="app" class="hidden"><div class="actions"><button class="primary" id="showAdd">Добавить запрос</button><button id="reload">Обновить</button><button id="change">Сменить сотрудника</button></div><form id="form" class="form hidden"><input id="partner" placeholder="Партнёр" required><input id="inn" placeholder="ИНН — 10 или 12 цифр" required><input id="model" placeholder="Модель" required><input id="manager" placeholder="Менеджер" required><input id="requested" type="number" min="0" placeholder="Запрос, шт."><input id="allocated" type="number" min="0" placeholder="Распределено, шт."><input id="dealer" type="number" min="0" placeholder="Дилеру, шт."><input id="reported" type="number" min="0" placeholder="Отчёт, шт."><div class="editbar"><button class="primary" id="save" type="submit">Сохранить запрос</button><button type="button" id="cancel">Отмена</button></div></form><section class="charts"><div class="chart"><h3>Статус воронки</h3><canvas id="funnelChart"></canvas></div><div class="chart"><h3>Топ компаний по запросу</h3><canvas id="companiesChart"></canvas></div></section><div id="data"></div></section></main><script>
const SUPABASE_URL='https://xufsoxmcsvxqujgijtqx.supabase.co',SUPABASE_KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';let employee=localStorage.getItem('umo_employee')||'',sb,rows=[],editingId=null,funnelChart,companiesChart;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const val=id=>$(id).value.trim(),num=id=>Number($(id).value)||0;function msg(t,ok=false){$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')}function grouped(data){const m=new Map;for(const r of data){const key=(r.inn||'').replace(/\D/g,'')||'Без ИНН';if(!m.has(key))m.set(key,{...r,requested_qty:0,allocated_qty:0,transferred_to_dealer_qty:0,reported_qty:0,count:0,models:new Set,managers:new Set,partners:new Set});const g=m.get(key);for(const k of ['requested_qty','allocated_qty','transferred_to_dealer_qty','reported_qty'])g[k]+=Number(r[k])||0;g.count++;if(r.model)g.models.add(r.model);if(r.manager)g.managers.add(r.manager);if(r.partner)g.partners.add(r.partner);if((r.request_date||'')>(g.request_date||''))g.request_date=r.request_date}return[...m.values()].sort((a,b)=>(b.request_date||'').localeCompare(a.request_date||''))}function draw(g){const sum=k=>g.reduce((s,x)=>s+x[k],0),v=[sum('requested_qty'),sum('allocated_qty'),sum('transferred_to_dealer_qty'),sum('reported_qty')];if(funnelChart)funnelChart.destroy();if(companiesChart)companiesChart.destroy();Chart.defaults.color='#c5cbc6';Chart.defaults.borderColor='#303632';funnelChart=new Chart($('funnelChart'),{type:'bar',data:{labels:['Запрос','Распределено','Дилеру','Отчёт'],datasets:[{data:v,backgroundColor:['#ff715f','#f5bd61','#55b8d2','#4ac7a2'],borderRadius:7}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}}}});const top=[...g].sort((a,b)=>b.requested_qty-a.requested_qty).slice(0,8);companiesChart=new Chart($('companiesChart'),{type:'bar',data:{labels:top.map(x=>[...x.partners][0]||x.inn),datasets:[{data:top.map(x=>x.requested_qty),backgroundColor:'#ff715f',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}}})}async function start(){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const{data,error}=await sb.from('employees').select('full_name').eq('active',true).order('sort_order');if(error)throw error;if(!employee){$('employee').innerHTML='<option value="">Выберите сотрудника</option>'+data.map(x=>`<option>${esc(x.full_name)}</option>`).join('');$('chooser').classList.remove('hidden');msg('Подключение успешно. Выберите сотрудника.',true);return}$('app').classList.remove('hidden');$('who').textContent=employee;msg('Подключение успешно.',true);await load()}catch(e){msg('Ошибка: '+e.message)}}async function load(){const{data,error}=await sb.from('partner_requests').select('*').order('request_date',{ascending:false});if(error)return msg('Ошибка загрузки данных: '+error.message);rows=data||[];const g=grouped(rows),sum=k=>g.reduce((s,x)=>s+x[k],0);draw(g);$('data').innerHTML=`<h2>Итоги по ИНН: запрос ${sum('requested_qty')} · распределено ${sum('allocated_qty')} · дилеру ${sum('transferred_to_dealer_qty')} · отчёт ${sum('reported_qty')}</h2><p class="muted">Исходных заявок: ${rows.length}; объединённых компаний: ${g.length}.</p><h2>Все заявки</h2>`+(rows.length?`<table><thead><tr><th>Дата</th><th>Партнёр</th><th>ИНН</th><th>Модель</th><th>Менеджер</th><th class="num">Запрос</th><th class="num">Распред.</th><th class="num">Дилеру</th><th class="num">Отчёт</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.request_date)}</td><td>${esc(x.partner)}</td><td>${esc(x.inn)}</td><td>${esc(x.model)}</td><td>${esc(x.manager)}</td><td class="num">${x.requested_qty||0}</td><td class="num">${x.allocated_qty||0}</td><td class="num">${x.transferred_to_dealer_qty||0}</td><td class="num">${x.reported_qty||0}</td><td class="right"><button class="secondary edit" data-id="${x.id}">Изменить</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Записей пока нет.</p>');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id))}function openForm(){ $('form').classList.remove('hidden');$('form').scrollIntoView({behavior:'smooth',block:'center'})}function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;editingId=id;$('partner').value=r.partner||'';$('inn').value=r.inn||'';$('model').value=r.model||'';$('manager').value=r.manager||'';$('requested').value=r.requested_qty||0;$('allocated').value=r.allocated_qty||0;$('dealer').value=r.transferred_to_dealer_qty||0;$('reported').value=r.reported_qty||0;$('save').textContent='Сохранить изменения';openForm();msg('Редактирование заявки. После сохранения пересчитаются таблица и графики.',true)}function resetForm(){$('form').reset();editingId=null;$('save').textContent='Сохранить запрос';$('form').classList.add('hidden')}$('choose').onclick=()=>{if(!val('employee'))return alert('Выберите сотрудника');employee=val('employee');localStorage.setItem('umo_employee',employee);location.reload()};$('change').onclick=()=>{localStorage.removeItem('umo_employee');location.reload()};$('reload').onclick=load;$('showAdd').onclick=()=>{resetForm();openForm()};$('cancel').onclick=resetForm;$('form').onsubmit=async e=>{e.preventDefault();const inn=val('inn').replace(/\D/g,'');if(!/^\d{10}(\d{2})?$/.test(inn))return alert('Введите ИНН из 10 или 12 цифр');const p={partner:val('partner'),inn,model:val('model'),manager:val('manager'),requested_qty:num('requested'),allocated_qty:num('allocated'),transferred_to_dealer_qty:num('dealer'),reported_qty:num('reported'),updated_by_name:employee};let error;if(editingId){({error}=await sb.from('partner_requests').update(p).eq('id',editingId))}else{p.request_date=new Date().toISOString().slice(0,10);p.created_by_name=employee;({error}=await sb.from('partner_requests').insert(p))}if(error)return msg('Не удалось сохранить: '+error.message);msg(editingId?'Изменения сохранены.':'Запрос сохранён.',true);resetForm();await load()};start();
</script></body></html>
