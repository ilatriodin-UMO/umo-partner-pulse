<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f8fb;color:#172033;font:14px Arial}.wrap{max-width:1280px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 24px #10182812}.login{max-width:520px;margin:40px auto}h1,h2{margin:0 0 10px}.muted{color:#667085}label{display:block;color:#344054}input,select,button{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font:inherit;box-sizing:border-box}input,select{width:100%;margin-top:7px}button{background:#155eef;color:#fff;border:0;font-weight:700;cursor:pointer;padding:0 16px;margin-top:12px}.secondary{background:#eff4ff;color:#1849a9}.danger{background:#fef3f2;color:#b42318}.status{margin-top:12px;padding:11px;border-radius:9px;background:#f2f4f7;white-space:pre-wrap}.ok{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{border:1px solid #e4e7ec;border-radius:13px;padding:15px}.value{font-size:25px;font-weight:800;margin-top:7px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wide{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1200px;margin-top:15px}th,td{padding:10px 8px;border-bottom:1px solid #e4e7ec;text-align:left}th{background:#f8fafc}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chartbox{border:1px solid #e4e7ec;border-radius:14px;padding:16px;min-height:220px}.barrow{display:grid;grid-template-columns:130px 1fr 45px;gap:8px;align-items:center;margin:13px 0}.bar{height:22px;border-radius:6px;background:#eef2f6;overflow:hidden}.bar i{display:block;height:100%;background:#155eef;border-radius:6px}.barrow:nth-child(2) i{background:#f79009}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#1849a9;font-weight:700;font-size:12px}.rel{position:relative}.suggest{position:absolute;z-index:10;left:0;right:0;background:#fff;border:1px solid #d0d5dd;border-radius:8px;margin-top:4px;max-height:200px;overflow:auto}.suggest div{padding:10px;cursor:pointer}.empty{text-align:center;color:#667085;padding:22px}@media(max-width:850px){.stats,.grid,.formgrid,.charts{grid-template-columns:repeat(2,1fr)}.wide{grid-column:auto}}@media(max-width:550px){.stats,.grid,.formgrid,.charts{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><section id="login" class="card login"><h1>UMO Partner Pulse</h1><p class="muted">Выберите сотрудника для входа</p><div id="loginStatus" class="status">Загрузка списка сотрудников…</div><label>Сотрудник<select id="employee"><option value="">Выберите сотрудника</option></select></label><input id="newEmployee" placeholder="Или введите имя вручную"><div class="actions"><button id="addEmployee" class="secondary">Добавить имя</button><button id="enter">Продолжить</button></div></section><main id="app" class="hidden"><section class="card"><h1>Воронка партнёрских продаж</h1><p id="userLine" class="muted"></p><div class="actions"><button id="reload" class="secondary">Обновить</button><button id="change" class="danger">Сменить сотрудника</button></div><div id="dbStatus" class="status">Подключение…</div></section><section class="card"><div class="formgrid"><label>Месяц<select id="month"></select></label><label>Дата заявки<input id="date" type="date"></label><label class="wide">Клиент<input id="client" placeholder="Название клиента"></label><label>ИНН<input id="inn" inputmode="numeric" placeholder="Введите ИНН"></label><div class="rel"><label>Код дилера<input id="dealerCode" placeholder="U-001"></label><div id="dealerSuggestions" class="suggest hidden"></div></div><label>Название дилера<input id="dealer" readonly></label><label>Запрошено<input id="requested" type="number" min="0"></label><label>Передано дилеру<input id="transferred" type="number" min="0"></label><label>Модель<select id="model"><option>UMO 5</option><option>UMO 8</option></select></label><label>Менеджер<input id="manager"></label><label>Вырученная сумма, ₽<input id="revenue" type="number" min="0" step="0.01"></label><label class="wide">Комментарий<input id="comment"></label></div><div class="actions"><button id="add">Добавить заявку</button><button id="clear" class="secondary">Очистить</button><button id="exportExcel" class="secondary">Выгрузить Excel</button></div><div id="formStatus" class="status hidden"></div></section><section class="stats"><div class="stat">Заявок<div class="value" id="count">0</div></div><div class="stat">Запрошено<div class="value" id="requestedTotal">0</div></div><div class="stat">Передано<div class="value" id="transferredTotal">0</div></div><div class="stat">Выручка<div class="value" id="revenueTotal">0,00 ₽</div></div><div class="stat">UMO 8<div class="value" id="umo8">0</div></div></section><section class="card charts"><div class="chartbox"><h2>Заявки по моделям</h2><div id="modelBars"></div></div><div class="chartbox"><h2>Выбранный месяц</h2><div id="monthInfo"></div></div></section><section class="card"><h2>Список заявок</h2><div class="tablewrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>ИНН</th><th>Модель</th><th>Менеджер</th><th>Запрошено</th><th>Передано</th><th>Выручка</th><th>Комментарий</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>window.addEventListener('DOMContentLoaded',()=>{const URL='https://xufsoxmcsvxqujgijtqx.supabase.co',KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),current=()=>today().slice(0,7),show=(e,t,k='')=>{if(e){e.textContent=t;e.className='status '+k}};const DEALERS={'U-001':'UMO Старк-Авто','U-002':'UMO Сибирские Моторы','U-003':'UMO РУМОС-АВТО','U-004':'UMO Бизнес Кар Левобережный','U-005':'UMO Бизнес Кар Балаклавский','U-006':'UMO Бизнес Кар Маршала Жукова','U-007':'UMO Бизнес Кар Воронеж','U-008':'UMO Бизнес Кар Краснодар','U-009':'UMO Бизнес Кар Кемерово','U-010':'UMO АВТОДОМ Запад','U-011':'UMO АВТОДОМ Шмитовский','U-012':'UMO АВТОДОМ Алтуфьево','U-013':'UMO ЭКСПЕРТ АВТО','U-014':'UMO Юг-Авто Кравнодар','U-015':'UMO РН АВТО Краснодар','U-016':'UMO МАРТЕН Вологда','U-017':'UMO ИАТ Волхонка','U-018':'UMO ИАТ Приморский','U-019':'UMO Автопрестиж Москва','U-020':'UMO Независимость','U-021':'UMO Major Новая Рига','U-022':'UMO Major Сокольники','U-023':'UMO Major МКАД 18 км','U-024':'UMO Major МКАД 47 км','U-025':'UMO Major Олимп','U-026':'UMO Автопрестиж Пермь','U-027':'UMO АВТОМИР Химки','U-028':'UMO Автокласс Тула','U-029':'UMO VERRA Уфа Север','U-030':'UMO VERRA Уфа Юг','U-031':'UMO VERRA Стерлитамак','U-032':'UMO VERRA Пермь','U-033':'UMO Автопродикс','U-034':'UMO Петровский Москва','U-035':'UMO Петровский Санкт-Петербург','U-036':'UMO Глобус Тамбов','U-037':'UMO Звезда Урала Челябинск','U-038':'UMO НФ-Моторс Калининград','U-039':'UMO БЦР Нижний Новгород','U-040':'UMO ИТС-Авто Ижевск','U-041':'UMO Автоимпорт Рязань','U-042':'UMO Оптима Сочи','U-043':'UMO Сигма Санкт-Петербург','U-044':'UMO Июль Екатеринбург','U-045':'UMO Форсаж Санкт-Петербург','U-046':'UMO Ринг Авто Воронеж','U-047':'UMO АВТОПОЛЕ Санкт-Петербург','U-048':'UMO Феникс Авто Омск','U-049':'UMO АГАТ Владимир','U-050':'UMO АГАТ Иваново','U-051':'UMO АГАТ Нижний Новгород','U-052':'UMO АГАТ Красноярск','U-053':'UMO АГАТ Волгоград','U-054':'UMO ТрансТехСервис Казань','U-055':'UMO Рольф Волгоградский','U-056':'UMO Динамика Калининград'};let employees=[],data=[],user='';try{employees=JSON.parse(localStorage.getItem('umo_employees')||'[]')}catch(e){}function draw(){employees=[...new Set(employees.map(x=>String(x).trim()).filter(Boolean))];$('employee').innerHTML='<option value="">Выберите сотрудника</option>'+employees.map(x=>'<option>'+esc(x)+'</option>').join('')}async function loadEmployees(){try{const r=await db.from('employees').select('full_name').eq('active',true).order('sort_order');if(r.error)throw r.error;employees=(r.data||[]).map(x=>x.full_name);draw();show($('loginStatus'),'Список загружен: '+employees.length,'ok')}catch(e){draw();show($('loginStatus'),'Не удалось загрузить список: '+e.message,'error')}}function initMonths(){const months=[];const now=new Date();for(let i=0;i<24;i++){const x=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(x.toISOString().slice(0,7))}['2026-09','2026-10','2026-11','2026-12'].forEach(m=>{if(!months.includes(m))months.push(m)});months.sort((a,b)=>b.localeCompare(a));$('month').innerHTML=months.map(v=>'<option value="'+v+'">'+v+'</option>').join('');$('month').value=months.includes(current())?current():'2026-09'}function render(){const rows=data.filter(x=>String(x.request_date||'').slice(0,7)===$('month').value),a=['UMO 5','UMO 8'].map(m=>rows.filter(x=>x.model===m).length),max=Math.max(1,...a);$('count').textContent=rows.length;$('requestedTotal').textContent=rows.reduce((z,x)=>z+Number(x.requested_qty||0),0);$('transferredTotal').textContent=rows.reduce((z,x)=>z+Number(x.transferred_to_dealer_qty||0),0);$('revenueTotal').textContent=rows.reduce((z,x)=>z+Number(x.reported_qty||0),0).toLocaleString('ru-RU',{minimumFractionDigits:2})+' ₽';$('umo8').textContent=a[1];$('modelBars').innerHTML=['UMO 5','UMO 8'].map((m,i)=>'<div class="barrow"><span>'+m+'</span><div class="bar"><i style="width:'+Math.round(a[i]/max*100)+'%"></i></div><b>'+a[i]+'</b></div>').join('');$('monthInfo').innerHTML='<p>Выбранный месяц: <b>'+esc($('month').value)+'</b></p><p>Заявок: <b>'+rows.length+'</b></p>';$('rows').innerHTML=rows.length?rows.map(x=>'<tr><td>'+esc(x.request_date)+'</td><td>'+esc(x.partner)+'</td><td>'+esc(x.inn)+'</td><td>'+esc(x.model)+'</td><td>'+esc(x.manager)+'</td><td>'+esc(x.requested_qty||0)+'</td><td>'+esc(x.transferred_to_dealer_qty||0)+'</td><td>'+esc(x.reported_qty||0)+'</td><td>'+esc(x.comment||'')+'</td><td><button type="button" class="danger delete-btn" data-delete-id="'+esc(x.id)+'">Удалить</button></td></tr>').join(''):'<tr><td colspan="10" class="empty">Нет заявок за выбранный месяц</td></tr>'}async function load(){const r=await db.from('partner_requests').select('*').order('request_date',{ascending:false});if(r.error){show($('dbStatus'),r.error.message,'error');return}data=r.data||[];show($('dbStatus'),'Подключение: OK. Загружено заявок: '+data.length,'ok');render()}async function deleteRequest(id,button){if(!id){show($('dbStatus'),'У записи нет id — удалить её невозможно.','error');return}if(!confirm('Удалить эту заявку?'))return;if(button){button.disabled=true;button.textContent='Удаление…'}const r=await db.from('partner_requests').delete().eq('id',id);if(r.error){if(button){button.disabled=false;button.textContent='Удалить'}show($('dbStatus'),'Ошибка удаления: '+r.error.message,'error');return}show($('dbStatus'),'Заявка удалена.','ok');await load()}document.addEventListener('click',e=>{const b=e.target.closest('.delete-btn');if(b)deleteRequest(b.getAttribute('data-delete-id'),b)});async function lookup(){const v=$('inn').value.replace(/\D/g,'');$('inn').value=v;if(![10,12].includes(v.length))return;show($('formStatus'),'Проверка ИНН…');try{const r=await db.functions.invoke('company-by-inn',{body:{inn:v}});if(r.error)throw r.error;const b=r.data||{},o=b.organization||b.company||b.data||b,n=o.name||o.full_name||o.value||b.name||'';if($('company'))$('company').textContent=n||'Не найдено';if(n)$('client').value=n;show($('formStatus'),n?'Контрагент найден.':'ИНН проверен, организация не найдена.',n?'ok':'error')}catch(e){show($('formStatus'),'Проверка ИНН не выполнена: '+e.message,'error')}}$('exportExcel').onclick=()=>{
  const month=$('month').value;
  const rows=data.filter(x=>String(x.request_date||'').slice(0,7)===month);
  const header=['Дата','Клиент','ИНН','Модель','Менеджер','Запрошено','Передано','Выручка','Комментарий'];
  const lines=[header,...rows.map(x=>[x.request_date,x.partner,x.inn,x.model,x.manager,x.requested_qty||0,x.transferred_to_dealer_qty||0,x.reported_qty||0,x.comment||''])];
  const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='umo-partner-pulse-'+month+'.csv';
  a.click();
  URL.revokeObjectURL(url);
};
$('addEmployee').onclick=()=>{const n=$('newEmployee').value.trim();if(!n)return;employees.push(n);draw();$('employee').value=n;$('newEmployee').value='';show($('loginStatus'),'Имя добавлено','ok')};$('enter').onclick=async()=>{user=$('employee').value;if(!user){show($('loginStatus'),'Выберите сотрудника.','error');return}$('login').className='hidden';$('app').className='';$('userLine').textContent='Сотрудник: '+user;await load()};$('reload').onclick=load;$('change').onclick=()=>location.reload();$('month').onchange=render;$('dealerCode').oninput=()=>{$('dealer').value=DEALERS[$('dealerCode').value.toUpperCase()]||''};$('inn').addEventListener('blur',lookup);$('inn').addEventListener('change',lookup);$('clear').onclick=()=>{['date','client','inn','dealerCode','dealer','requested','transferred','manager','revenue','comment'].forEach(id=>$(id).value='');show($('formStatus'),'Поля очищены','ok')};$('add').onclick=async()=>{const requested=Number($('requested').value||0),transferred=Number($('transferred').value||0),revenue=Number($('revenue').value||0),partner=$('client').value.trim();if(!partner){show($('formStatus'),'Заполните клиента после проверки ИНН.','error');return}if(transferred>requested){show($('formStatus'),'Переданное количество больше запрошенного.','error');return}const p={request_date:$('date').value||today(),partner,inn:$('inn').value.trim(),model:$('model').value,manager:$('manager').value.trim()||user,requested_qty:requested,allocated_qty:transferred,transferred_to_dealer_qty:transferred,reported_qty:revenue,comment:$('comment').value.trim(),created_by_name:user};const r=await db.from('partner_requests').insert(p);if(r.error){show($('formStatus'),'Ошибка сохранения: '+r.error.message,'error');return}show($('formStatus'),'Заявка сохранена','ok');await load();$('date').value=today();$('client').value='';$('inn').value='';$('requested').value='';$('transferred').value='';$('revenue').value='';$('comment').value=''};initMonths();draw();loadEmployees()});</script></body></html>
