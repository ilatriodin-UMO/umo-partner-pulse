<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d0f0e;color:#f1f3ef;font:15px Arial;padding:24px}.box{max-width:980px;margin:auto;background:#171a18;border:1px solid #303632;border-radius:14px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303632;padding-bottom:16px}.logo{display:inline-grid;place-items:center;width:30px;height:30px;background:#ff715f;border-radius:8px;color:#111;font-weight:bold;margin-right:8px}.muted{color:#9ba39d}.status{margin:20px 0;padding:14px;border-radius:8px;background:#202521;white-space:pre-wrap;line-height:1.5}.ok{border-left:4px solid #4ac7a2}.err{border-left:4px solid #ff715f;background:#38201d}.actions{display:flex;gap:10px;flex-wrap:wrap}button,select,input{padding:10px 14px;border-radius:8px;border:1px solid #424a45;background:#0d0f0e;color:#fff;font-size:14px;cursor:pointer}.primary{background:#ff715f;color:#111;border:0;font-weight:bold}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:10px;border-bottom:1px solid #303632}.num{text-align:right}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.form input{min-width:0}@media(max-width:700px){.form{grid-template-columns:repeat(2,1fr)}.box{padding:16px}}</style></head><body><main class="box"><div class="top"><div><span class="logo">U</span><b>PARTNER PULSE</b></div><div id="who" class="muted"></div></div><h1>Воронка партнёрских продаж</h1><p class="muted">Подключение к Supabase без передачи ФИО в HTTP-заголовках.</p><div id="status" class="status">Проверяем подключение…</div><section id="chooser" class="hidden"><h2>Выберите сотрудника</h2><select id="employee"></select><button class="primary" id="choose">Продолжить</button></section><section id="app" class="hidden"><div class="actions"><button class="primary" id="showAdd">Добавить запрос</button><button id="reload">Обновить</button><button id="change">Сменить сотрудника</button></div><form id="form" class="form hidden"><input id="partner" placeholder="Партнёр" required><input id="inn" placeholder="ИНН"><input id="model" placeholder="Модель"><input id="manager" placeholder="Менеджер"><input id="requested" type="number" min="0" placeholder="Запрос, шт."><input id="allocated" type="number" min="0" placeholder="Распределено, шт."><input id="dealer" type="number" min="0" placeholder="Дилеру, шт."><input id="reported" type="number" min="0" placeholder="Отчёт, шт."><button class="primary" type="submit">Сохранить запрос</button><button type="button" id="cancel">Отмена</button></form><div id="data"></div></section></main><script>
const SUPABASE_URL='https://xufsoxmcsvxqujgijtqx.supabase.co';const SUPABASE_KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';let employee=localStorage.getItem('umo_employee')||'',sb,rows=[];const $=x=>document.getElementById(x);function msg(t,ok=false){$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')}const n=id=>Number($(id).value)||0;async function start(){try{if(!window.supabase)throw Error('Не загрузилась библиотека Supabase');sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const{data,error}=await sb.from('employees').select('full_name').eq('active',true).order('sort_order');if(error)throw error;if(!employee){$('employee').innerHTML='<option value="">Выберите сотрудника</option>'+data.map(x=>`<option value="${x.full_name.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${x.full_name}</option>`).join('');$('chooser').classList.remove('hidden');msg('Подключение успешно. Выберите сотрудника.',true);return}$('chooser').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=employee;msg('Подключение успешно.',true);await load()}catch(e){msg('Ошибка: '+e.message+'\n\nProject URL: '+SUPABASE_URL)}}async function load(){const{data,error}=await sb.from('partner_requests').select('*').order('request_date',{ascending:false});if(error){msg('Ошибка загрузки данных: '+error.message);return}rows=data||[];const sum=k=>rows.reduce((s,x)=>s+(Number(x[k])||0),0);$('data').innerHTML=`<h2>Итоги: запрос ${sum('requested_qty')} · распределено ${sum('allocated_qty')} · дилеру ${sum('transferred_to_dealer_qty')} · отчёт ${sum('reported_qty')}</h2>`+(rows.length?`<table><thead><tr><th>Дата</th><th>Партнёр</th><th>ИНН</th><th>Модель</th><th>Менеджер</th><th class="num">Запрос</th><th class="num">Распред.</th><th class="num">Дилеру</th><th class="num">Отчёт</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.request_date||''}</td><td>${x.partner||''}</td><td>${x.inn||''}</td><td>${x.model||''}</td><td>${x.manager||''}</td><td class="num">${x.requested_qty||0}</td><td class="num">${x.allocated_qty||0}</td><td class="num">${x.transferred_to_dealer_qty||0}</td><td class="num">${x.reported_qty||0}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Записей пока нет.</p>')}$('choose').onclick=()=>{if(!$('employee').value)return alert('Выберите сотрудника');employee=$('employee').value;localStorage.setItem('umo_employee',employee);location.reload()};$('change').onclick=()=>{localStorage.removeItem('umo_employee');location.reload()};$('reload').onclick=load;$('showAdd').onclick=()=>$('form').classList.toggle('hidden');$('cancel').onclick=()=>$('form').classList.add('hidden');$('form').onsubmit=async e=>{e.preventDefault();const payload={request_date:new Date().toISOString().slice(0,10),partner:$('partner').value.trim(),inn:$('inn').value.trim()||null,model:$('model').value.trim()||null,manager:$('manager').value.trim()||null,requested_qty:n('requested'),allocated_qty:n('allocated'),transferred_to_dealer_qty:n('dealer'),reported_qty:n('reported'),created_by_name:employee,updated_by_name:employee};const{error}=await sb.from('partner_requests').insert(payload);if(error){msg('Не удалось сохранить запрос: '+error.message);return}e.target.reset();e.target.classList.add('hidden');msg('Запрос сохранён.',true);await load()};start();
</script></body></html>
