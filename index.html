<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse — debug safe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#f6f8fb;color:#172033;font:14px Arial}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #eaecf0;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 8px 24px #10182812}h1{margin-top:0}label{display:block;font-weight:700;color:#667085;margin:14px 0 7px}input,select,button{height:46px;border:1px solid #d0d5dd;border-radius:11px;padding:0 13px;font:inherit;box-sizing:border-box}select,input{width:100%}button{background:#155eef;color:#fff;border:0;font-weight:700;cursor:pointer;padding:0 16px;margin-top:10px}.muted{color:#667085}.status{padding:12px;border-radius:10px;background:#f2f4f7;margin-top:16px;white-space:pre-wrap}.ok{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:160px}</style>
</head>
<body><div class="wrap"><div class="card"><h1>UMO Partner Pulse</h1><p class="muted">Проверка подключения и списка сотрудников</p><div id="status" class="status">Инициализация…</div><label for="employee">Выберите пользователя</label><select id="employee"><option value="">Загрузка…</option></select><div class="actions"><button id="retry">Повторить загрузку</button><button id="continue">Продолжить</button></div><label for="newUser">Добавить пользователя вручную</label><input id="newUser" placeholder="Имя сотрудника"><button id="addUser">Добавить имя</button><p id="manual" class="muted"></p></div></div>
<script>
(function(){'use strict';
const SUPABASE_URL='https://xufsoxmcsvxqujgijtqx.supabase.co';
const SUPABASE_KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';
const USERS_KEY='umo_dashboard_users';
const $=id=>document.getElementById(id);
const status=t=>{$('status').textContent=t};
const localUsers=()=>{try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch(e){return[]}};
const saveUsers=a=>localStorage.setItem(USERS_KEY,JSON.stringify([...new Set(a.map(x=>String(x).trim()).filter(Boolean))]));
function render(list){const el=$('employee');if(!el)return;el.innerHTML='<option value="">Выберите пользователя</option>'+list.map(x=>`<option>${String(x).replace(/[&<>"']/g,'')}</option>`).join('');}
function localFallback(){const a=localUsers();render(a);status(a.length?'Supabase недоступен. Загружен локальный список сотрудников.':'Supabase недоступен. Добавьте имя вручную.');$('status').className='status error'}
async function load(){try{if(!window.supabase)throw new Error('SDK Supabase не загрузился');const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);status('Подключение к Supabase…');const result=await client.from('employees').select('full_name').eq('active',true).order('sort_order');if(result.error)throw result.error;const list=(result.data||[]).map(x=>x.full_name).filter(Boolean);saveUsers(list);render(list);status(`Подключение успешно. Найдено сотрудников: ${list.length}`);$('status').className='status ok'}catch(e){localFallback();$('manual').textContent='Техническая ошибка: '+e.message}}
$('retry').onclick=load;
$('continue').onclick=()=>{const v=$('employee').value;if(!v){status('Сначала выберите пользователя или добавьте имя.');$('status').className='status error';return}localStorage.setItem('umo_employee',v);status('Пользователь выбран: '+v)};
$('addUser').onclick=()=>{const v=$('newUser').value.trim();if(!v)return;saveUsers([...localUsers(),v]);$('newUser').value='';render(localUsers());$('employee').value=v;$('manual').textContent='Пользователь добавлен в локальный список.'};
load();
})();
</script></body></html>
