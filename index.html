<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UMO Partner Pulse — проверка подключения</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box; background:#0d0f0e; color:#f1f3ef; font:15px Arial,sans-serif; }
    .box { width:min(720px,100%); background:#171a18; border:1px solid #303632; border-radius:14px; padding:28px; }
    .brand { font-size:12px; font-weight:bold; letter-spacing:.1em; }
    .logo { display:inline-grid; place-items:center; width:30px; height:30px; margin-right:8px; border-radius:8px; background:#ff715f; color:#15110f; font-size:17px; }
    h1 { margin:18px 0 8px; font-size:27px; }
    p { color:#9ba39d; line-height:1.6; }
    .status { margin:20px 0; padding:14px; background:#202521; border-left:4px solid #c8f133; border-radius:8px; white-space:pre-wrap; line-height:1.55; }
    .status.error { background:#37201c; border-left-color:#ff715f; }
    .status.ok { background:#173127; border-left-color:#4ac7a2; }
    select,button { width:100%; box-sizing:border-box; margin-top:10px; padding:12px; border-radius:8px; font-size:15px; }
    select { border:1px solid #3c443f; color:#f1f3ef; background:#0d0f0e; }
    button { border:0; background:#ff715f; color:#17110f; font-weight:bold; cursor:pointer; }
    .hidden { display:none; }
    .details { margin-top:14px; font:12px ui-monospace,Consolas,monospace; color:#bbc3bd; white-space:pre-wrap; line-height:1.5; }
  </style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="logo">U</span>PARTNER PULSE</div>
    <h1>Проверка подключения</h1>
    <p>Страница проверяет подключение к Supabase и загрузку списка сотрудников.</p>
    <div id="status" class="status">Подключаемся к Supabase…</div>
    <div id="form" class="hidden">
      <label for="employee">Сотрудник</label>
      <select id="employee"></select>
      <button id="continue">Сохранить выбор и продолжить</button>
    </div>
    <div id="details" class="details"></div>
  </main>

  <script>
    // Настройки НОВОГО проекта Supabase
    const SUPABASE_URL = 'https://xufsoxmcsvxqujgijtqx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';

    const statusBox = document.getElementById('status');
    const details = document.getElementById('details');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    async function checkConnection() {
      try {
        if (!window.supabase) {
          throw new Error('Библиотека Supabase не загрузилась. Проверьте доступ к jsdelivr.net или интернет-соединение.');
        }

        statusBox.textContent = 'Подключение установлено. Загружаем список сотрудников…';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const response = await client
          .from('employees')
          .select('id, full_name, active, sort_order')
          .eq('active', true)
          .order('sort_order', { ascending: true });

        details.textContent = `Project URL: ${SUPABASE_URL}\nHTTP status: ${response.status ?? 'не указан'} ${response.statusText ?? ''}`;

        if (response.error) {
          throw new Error(
            `${response.error.message}\n\nCode: ${response.error.code ?? '—'}\nDetails: ${response.error.details ?? '—'}\nHint: ${response.error.hint ?? '—'}`
          );
        }

        if (!response.data || response.data.length === 0) {
          throw new Error('Подключение работает, но активных сотрудников не найдено. В Supabase откройте Table Editor → employees и проверьте, что у нужных строк active = true.');
        }

        document.getElementById('employee').innerHTML =
          '<option value="">Выберите сотрудника</option>' +
          response.data.map(row => `<option value="${escapeHtml(row.full_name)}">${escapeHtml(row.full_name)}</option>`).join('');

        statusBox.className = 'status ok';
        statusBox.textContent = `Готово: найдено сотрудников — ${response.data.length}. Выберите себя из списка.`;
        document.getElementById('form').classList.remove('hidden');
      } catch (error) {
        statusBox.className = 'status error';
        statusBox.textContent = `Ошибка подключения: ${error.message}`;
        details.textContent += '\n\nПроверьте, что в Supabase создана таблица employees и разрешено чтение для роли anon.';
      }
    }

    document.getElementById('continue').addEventListener('click', () => {
      const name = document.getElementById('employee').value;
      if (!name) {
        alert('Выберите сотрудника из списка.');
        return;
      }
      localStorage.setItem('umo_employee', name);
      alert(`Выбран сотрудник: ${name}. Теперь замените этот index.html основным файлом дашборда.`);
    });

    checkConnection();
  </script>
</body>
</html>
