<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMO Partner Pulse — проверка подключения</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d0f0e;color:#f1f3ef;font:15px Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.box{width:min(720px,100%);background:#171a18;border:1px solid #303632;border-radius:14px;padding:28px}.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#ff715f;color:#111;font-weight:bold;margin-right:8px}.title{font-size:26px;margin:18px 0 8px}.muted{color:#9aa19c;line-height:1.55}.status{margin:20px 0;padding:14px;border-radius:8px;background:#202521;border-left:4px solid #c8f133;white-space:pre-wrap;line-height:1.5}.error{border-left-color:#ff715f;background:#37201c}.ok{border-left-color:#4ac7a2}.hidden{display:none}select,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #3c443f;background:#0d0f0e;color:#f1f3ef;font-size:15px}button{cursor:pointer;background:#ff715f;color:#17110f;border:0;font-weight:bold}.details{font-family:monospace;font-size:12px;color:#b9c1bb;margin-top:12px;white-space:pre-wrap}</style></head><body><div class="box"><div><span class="logo">U</span><b>PARTNER PULSE</b></div><div class="title">Проверка подключения</div><p class="muted">Эта страница проверяет, доступна ли таблица сотрудников из вашего нового Supabase-проекта.</p><div id="status" class="status">Подключаемся к Supabase…</div><div id="form" class="hidden"><label>Сотрудник<select id="employee"></select></label><button id="continue">Продолжить</button></div><div id="details" class="details"></div></div><script>
const URL='https://xufsoxmcsvxqujgijtqx.supabase.co';
const KEY='sb_publishable_16g5md6y-0BWFC_cjEppqQ_O_bgZb0S';
const $=id=>document.getElementById(id);const status=$('status');
async function run(){
 try{
  if(!window.supabase)throw new Error('Библиотека Supabase не загрузилась. Проверьте подключение к интернету или блокировку jsdelivr.');
  status.textContent='Библиотека загружена. Запрашиваем сотрудников…';
  const sb=supabase.createClient(URL,KEY);
  const {data,error,status:code,statusText}=await sb.from('employees').select('id, full_name, active, sort_order').eq('active',true).order('sort_order');
  $('details').textContent='Project URL: '+URL+'\nHTTP status: '+code+' '+(statusText||'');
  if(error)throw new Error(error.message+'\n\nCode: '+(error.code||'—')+'\nDetails: '+(error.details||'—')+'\nHint: '+(error.hint||'—'));
  if(!data||!data.length)throw new Error('Запрос выполнен, но активных сотрудников нет. Откройте Supabase → Table Editor → employees и убедитесь, что у сотрудников active = true.');
  status.className='status ok';status.textContent='Готово: найдено сотрудников — '+data.length+'. Список должен загружаться в основном дашборде.';
  $('employee').innerHTML='<option value="">Выберите сотрудника</option>'+data.map(x=>'<option>'+x.full_name.replace(/</g,'&lt;')+'</option>').join('');$('form').classList.remove('hidden');
 }catch(e){status.className='status error';status.textContent='Ошибка подключения: '+e.message;$('details').textContent+='\n\nПроверьте: таблица employees существует; включена политика SELECT для роли anon; файл опубликован через HTTPS.'}
}
$('continue').onclick=()=>{if(!$('employee').value)return;localStorage.setItem('umo_employee',$('employee').value);alert('Имя сохранено: '+$('employee').value+'. Теперь откройте основной файл дашборда.');};run();
</script></body></html>
